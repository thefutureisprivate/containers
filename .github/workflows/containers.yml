name: Containers
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make check

  smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [kanidm, kanidm-radius, stalwart, prometheus, blackbox-exporter, postgres-exporter, node-exporter, alertmanager, postgresql]
    env:
      PODMAN_COMMAND: sudo podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: python3 scripts/prepare.py "${{ matrix.image }}"
      - run: python3 scripts/smoke.py "${{ matrix.image }}"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: obs-publication
      cancel-in-progress: false
    env:
      PODMAN_COMMAND: sudo podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y podman skopeo gnupg
      - name: Prepare offline OBS contexts
        run: python3 scripts/prepare.py all
      - name: Publish reviewed sources
        id: publication
        env:
          OBS_CREDENTIALS: ${{ secrets.OBS_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; leaving publication to its workflow.'
            exit 0
          fi
          test -n "$OBS_CREDENTIALS" || { echo 'Set the OBS_CREDENTIALS Actions secret (see README).'; exit 1; }
          credentials="$RUNNER_TEMP/obs-credentials.json"
          trap 'rm -f "$credentials"' EXIT
          umask 077
          printf '%s' "$OBS_CREDENTIALS" > "$credentials"
          OBS_CREDENTIALS_FILE="$credentials" python3 scripts/obs.py publish all
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Verify signed OBS releases and their input provenance
        if: steps.publication.outputs.published == 'true'
        run: python3 scripts/verify_all.py --timeout 1800
